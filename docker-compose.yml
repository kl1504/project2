services:
  app:
    image: project2-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: velstore1
      DB_USERNAME: velstore
      DB_PASSWORD: velstore_password
    depends_on:
      storage-init:
        condition: service_completed_successfully
      build-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - velstore-storage:/var/www/html/storage
      - velstore-build:/var/www/html/public/build
    networks:
      - velstore

  storage-init:
    image: project2-app
    command: sh -c "mkdir -p /shared/app/public && cp -a /var/www/html/storage/app/public/. /shared/app/public/"
    volumes:
      - velstore-storage:/shared
    networks:
      - velstore

  build-init:
    image: project2-app
    command: sh -c "mkdir -p /shared && cp -a /var/www/html/public/build/. /shared/"
    volumes:
      - velstore-build:/shared
    networks:
      - velstore

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "7001:80"
    volumes:
      - .:/var/www/html:ro
      - velstore-storage:/var/www/html/storage:ro
      - velstore-build:/build-assets:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - velstore

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: velstore1
      MYSQL_USER: velstore
      MYSQL_PASSWORD: velstore_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - velstore-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uvelstore", "-pvelstore_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - velstore

volumes:
  velstore-db:
  velstore-storage:
  velstore-build:

networks:
  velstore: