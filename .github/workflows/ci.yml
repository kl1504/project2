name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-prechecks: 
    name: Security Prechecks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1


      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: 
          scan-type: 'fs'
          scan-ref: '.'
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: 8.4
          extensions: mbstring, xml, ctype, iconv
          tools: composer
          ini-values: post_max_size=256M, upload_max_filesize=256M
          

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run Pint
        run: vendor/bin/pint --test
      
  test:
    name: Execute Application Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, sqlite, pdo_sqlite
          tools: composer
          coverage: none
          ini-values: post_max_size=256M, upload_max_filesize=256M

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: |
          php artisan key:generate
          php artisan config:clear

      - name: Prepare SQLite database
        run: |
          touch database/database.sqlite
          php artisan migrate --no-interaction --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  static-testing:
    name: Static Code Quality
    runs-on: ubuntu-24.04
    needs: test
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Analyse SonarQube
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        
      - name: Run SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build the assets
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
  
      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiled-assets
          path: public/build

  deploy:
    name: Deploy to production server
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: DownloadArtifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: compiled-assets
          path: public/build

      - name: Build Local Docker Image
        run: docker compose build --no-cache

      - name: Start Docker Containers
        run: docker compose up -d

      - name: Run the post-deployment tests
        run: |
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan config:cache
          docker compose exec -T app php artisan route:cache
          docker compose exec -T app php artisan view:cache

      - name: Récupérer l'IP local du runner
        id: local_ip
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $2}') 
          echo "L'adresse IP locale de ce runner est : $RUNNER_IP"
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Valider l'accès via l'IP et le port
        run: |
          sleep 10
          echo "Site accessible sur : http://${{ steps.local_ip.outputs.ip }}:7001"
          curl -v http://${{ steps.local_ip.outputs.ip }}:7001


      - name: Docker Clean Up
        run: docker image prune -f

  dast_scan:
    name: DAST Scan
    runs-on: ubuntu-24.04
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan DAST with OWASP ZAP
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://192.168.122.1:7001'
          cmd_options: '-a'          # active tous les scanners
          fail_action: false         # ne bloque pas le pipeline (à mettre à true si tu veux du gate strict)
          artifact_name: 'zap-report'

      - name: Installwkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf 
 
      - name: Convert ZAP report into PDF
        run: |
          wkhtmltopdf --enable-local-file-access report_html.html zap-vulnerability-report.pdf
 
      # --- Étape 6 : publier le PDF comme artefact téléchargeable du run ---
      - name: Publish the report
        uses: actions/upload-artifact@v4
        with:
          name: zap-vulnerability-report-pdf
          path: zap-vulnerability-report.pdf
          retention-days: 15

