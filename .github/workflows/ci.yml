name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, ctype, iconv
          cache: composer
          ini-values: post_max_size=256M, upload_max_filesize=256M
          

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run Pint
        run: vendor/bin/pint --test

  test:
    name: Execute Application Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, sqlite, pdo_sqlite
          coverage: none
          cache: composer
          ini-values: post_max_size=256M, upload_max_filesize=256M

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: |
          php artisan key:generate
          php artisan config:clear

      - name: Prepare SQLite database
        run: |
          touch database/database.sqlite
          php artisan migrate --no-interaction --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  build:
    name: Build the assets
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
  
      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: public/build

  deploy:
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: DownloadArtifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-assets
          path: public/build

      - name: Build Local Docker Image
        run: docker compose build --no-cache

      - name: Start Docker Containers
        run: docker compose up -d

      - name: Run the post-deployment tests
        run: |
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan config:cache
          docker compose exec -T app php artisan route:cache
          docker compose exec -T app php artisan view:cache

      - name: Récupérer l'IP local du runner
        id: local_ip
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $2}') 
          echo "L'adresse IP locale de ce runner est : $RUNNER_IP"
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Valider l'accès via l'IP et le port
        run: |
          sleep 10
          echo "Site accessible sur : http://${{ steps.local_ip.outputs.ip }}:7001"
          curl -v http://${{ steps.local_ip.outputs.ip }}:7001


      - name: Docker Clean Up
        run: docker image prune -f

  



